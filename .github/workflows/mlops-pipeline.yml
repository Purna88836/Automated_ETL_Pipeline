name: MLOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  data-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Run data checks
        run: python scripts/data_checks.py

  train:
    runs-on: ubuntu-latest
    needs: data-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Train model
        run: python scripts/train.py

  evaluate:
    runs-on: ubuntu-latest
    needs: train
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Evaluate model
        run: python scripts/evaluate.py

  register:
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Register model
        run: python scripts/register.py

  deploy:
    runs-on: ubuntu-latest
    needs: register
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Deploy model
        run: python scripts/deploy.py